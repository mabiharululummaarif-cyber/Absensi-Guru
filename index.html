<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155e4b"><title>Absensi Guru | MA Biharul Ulum Ma’arif</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f2;color:#20352d;font-family:Arial, sans-serif}.head{background:#155e4b;color:white;padding:28px 18px;text-align:center}.head .mark{font-size:28px}.head h1{margin:8px 0;font-size:25px}.head p{margin:0;color:#d5e9dd;font-size:14px}.wrap{max-width:560px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid #dce8df;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #183b2810}.date{text-align:center;color:#5e7468;font-size:13px}.time{text-align:center;font-size:24px;font-weight:bold;color:#155e4b;margin:8px 0 16px}label{display:block;font-size:14px;font-weight:bold;margin:14px 0 7px}input,select{width:100%;padding:13px;border:1px solid #cbd9cf;border-radius:10px;font-size:16px;background:white;color:#20352d}button{width:100%;padding:14px;border:0;border-radius:10px;background:#155e4b;color:white;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}button.light{background:#e8f3eb;color:#155e4b;margin-top:10px}.note{font-size:12px;line-height:1.5;color:#79683d;background:#fff8e7;border-radius:9px;padding:11px;margin-top:14px}.entry{padding:12px 0;border-top:1px solid #e5ece7;display:flex;justify-content:space-between;gap:10px;font-size:14px}.entry small{display:block;color:#6b7d73;margin-top:4px}.tag{color:#155e4b;background:#e8f3eb;border-radius:20px;padding:5px 9px;font-size:12px;height:max-content}.empty{text-align:center;color:#718077;padding:16px 0;font-size:14px}.foot{text-align:center;color:#7a8b80;font-size:12px;padding:8px 0 24px}
</style></head>
<body><header class="head"><div class="mark">✦</div><h1>Absensi Guru</h1><p>MA Biharul Ulum Ma’arif</p></header>
<main class="wrap"><section class="card"><div class="date" id="date"></div><div class="time" id="time"></div>
<form id="form"><label for="name">Nama Guru</label><input id="name" placeholder="Tulis nama lengkap" maxlength="100" required>
<label for="type">Absensi</label><select id="type"><option>Datang</option><option>Pulang</option></select>
<label for="status">Status</label><select id="status"><option>Hadir</option><option>Terlambat</option><option>Izin</option><option>Sakit</option></select>
<button type="submit">Simpan Absensi</button></form>
<div class="note">Data pada versi sederhana ini tersimpan di browser/perangkat yang digunakan, belum terkirim ke admin atau Google Sheets.</div></section>
<section class="card"><strong>Riwayat Absensi</strong><div id="list"></div><button class="light" id="csv" type="button">Unduh Riwayat (CSV)</button></section><div class="foot">MA Biharul Ulum Ma’arif</div></main>
<script>
const $=id=>document.getElementById(id),key='ma_biharul_absensi_v1';
const pad=n=>String(n).padStart(2,'0');
function today(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tick(){let d=new Date();$('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('time').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function data(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
function draw(){let rows=data();$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">Belum ada absensi.</div>';return}rows.forEach(r=>{let item=document.createElement('div');item.className='entry';let info=document.createElement('div'),b=document.createElement('b'),s=document.createElement('small'),tag=document.createElement('span');b.textContent=r.name;s.textContent=r.date+' • '+r.time+' • '+r.type;tag.className='tag';tag.textContent=r.status;info.append(b,s);item.append(info,tag);$('list').append(item)})}
$('form').addEventListener('submit',e=>{e.preventDefault();let d=new Date(),rows=data();rows.unshift({name:$('name').value.trim(),type:$('type').value,status:$('status').value,date:today(),time:pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())});try{localStorage.setItem(key,JSON.stringify(rows));e.target.reset();draw();alert('Absensi tersimpan di perangkat ini.')}catch(err){alert('Data tidak dapat disimpan di browser.')}});
$('csv').addEventListener('click',()=>{let rows=data();if(!rows.length){alert('Belum ada data.');return}let keys=['name','date','time','type','status'],csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='riwayat-absensi.csv';a.click();URL.revokeObjectURL(u)});
tick();setInterval(tick,1000);draw();
</script></body></html>
