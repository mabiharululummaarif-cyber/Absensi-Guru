<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155e4b"><title>Absensi Guru | MA Biharul Ulum Ma’arif</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f3;color:#1d352c;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.head{background:linear-gradient(135deg,#104b3c,#21805d);color:#fff;padding:30px 18px 44px;text-align:center}.logo{font-size:30px}.head h1{margin:7px 0;font-size:26px}.head p{margin:0;color:#d8eee2;font-size:14px}.wrap{max-width:540px;margin:-22px auto 0;padding:0 14px 28px}.card{background:white;border:1px solid #dce9df;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 8px 24px #163e2910}.date{text-align:center;color:#6b7e72;font-size:13px}.time{text-align:center;color:#155e4b;font-size:28px;font-weight:800;margin:6px 0 17px;font-variant-numeric:tabular-nums}.muted{font-size:13px;color:#708176}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef7f0;border-radius:13px;padding:14px}.person small{display:block;color:#668071;font-size:12px;margin-bottom:3px}.person strong{font-size:17px}.linkbtn{border:0;background:transparent;color:#176449;font-weight:700;padding:9px;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.tap{border:0;border-radius:14px;padding:19px 8px;background:#155e4b;color:white;font-weight:750;font-size:16px;cursor:pointer;box-shadow:0 5px 12px #155e4b20}.tap.out{background:#e9f4ec;color:#155e4b;box-shadow:none;border:1px solid #d3e5d8}.tap span{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:5px}.notice{background:#fff8e7;color:#78683f;border-radius:10px;padding:11px;font-size:12px;line-height:1.5;margin-top:15px}.entry{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #e6eee8;padding:12px 0;font-size:14px}.entry small{display:block;color:#738378;margin-top:4px}.tag{font-size:11px;background:#e8f4eb;color:#155e4b;padding:5px 8px;border-radius:20px;white-space:nowrap}.empty{text-align:center;color:#718077;padding:18px 0;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.download{border:0;border-radius:9px;background:#e9f4ec;color:#155e4b;font-weight:700;padding:9px 11px;cursor:pointer}.foot{text-align:center;color:#819086;font-size:12px;padding:8px}
</style></head><body>
<header class="head"><div class="logo">✦</div><h1>Absensi Guru</h1><p>MA Biharul Ulum Ma’arif</p></header>
<main class="wrap"><section class="card"><div class="date" id="date"></div><div class="time" id="time"></div>
<div class="person"><div><small>Nama guru</small><strong id="person">Belum diatur</strong></div><button class="linkbtn" id="change" type="button">Ganti nama</button></div>
<div class="actions"><button class="tap" id="in" type="button">✓ Datang<span>Ketuk untuk absen</span></button><button class="tap out" id="out" type="button">↗ Pulang<span>Ketuk untuk absen</span></button></div>
<div class="notice">Atur nama sekali di perangkat ini. Berikutnya cukup ketuk Datang atau Pulang. Data versi ini tersimpan hanya di browser perangkat, belum terkirim ke admin atau Google Sheets.</section>
<section class="card"><div class="row"><strong>Riwayat absensi</strong><button class="download" id="csv" type="button">Unduh CSV</button></div><div id="list"></div></section><div class="foot">MA Biharul Ulum Ma’arif</div></main>
<script>
const $=id=>document.getElementById(id),key='ma_biharul_absensi_v1',nameKey='ma_biharul_guru_name';
const pad=n=>String(n).padStart(2,'0');function today(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tick(){let d=new Date();$('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('time').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
function setPerson(){let n=localStorage.getItem(nameKey)||'';$('person').textContent=n||'Belum diatur'}
$('change').onclick=()=>{let old=localStorage.getItem(nameKey)||'',n=prompt('Masukkan nama lengkap guru:',old);if(n===null)return;n=n.trim();if(!n){alert('Nama tidak boleh kosong.');return}localStorage.setItem(nameKey,n);setPerson()};
function punch(type){let n=localStorage.getItem(nameKey);if(!n){alert('Atur nama guru terlebih dahulu.');$('change').click();n=localStorage.getItem(nameKey)}if(!n)return;let d=new Date(),rows=get();rows.unshift({name:n,type,status:'Hadir',date:today(d),time:pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())});try{localStorage.setItem(key,JSON.stringify(rows));draw();alert('Absensi '+type.toLowerCase()+' berhasil dicatat.')}catch(e){alert('Data tidak dapat disimpan pada browser ini.')}}
$('in').onclick=()=>punch('Datang');$('out').onclick=()=>punch('Pulang');
function draw(){let rows=get();$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">Belum ada catatan absensi.</div>';return}rows.slice(0,30).forEach(r=>{let el=document.createElement('div');el.className='entry';let info=document.createElement('div'),b=document.createElement('b'),s=document.createElement('small'),tag=document.createElement('span');b.textContent=r.name;s.textContent=r.date+' • '+r.time+' • '+r.type;tag.className='tag';tag.textContent=r.status||'Hadir';info.append(b,s);el.append(info,tag);$('list').append(el)})}
$('csv').onclick=()=>{let rows=get();if(!rows.length){alert('Belum ada data.');return}let cols=['name','date','time','type','status'],csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='absensi-guru-'+today()+'.csv';a.click();URL.revokeObjectURL(u)};
tick();setInterval(tick,1000);setPerson();draw();
</script></body></html>
